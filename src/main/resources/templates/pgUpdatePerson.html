<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update | Ночная симфония</title>
    <!-- Подключаем шрифт Clash Display и General Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=General+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "General Sans", sans-serif;
            background: #0c0f15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Анимированный фон с частицами */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            from {
                transform: translateY(100vh) rotate(0deg);
            }
            to {
                transform: translateY(-100px) rotate(360deg);
            }
        }

        /* Основной контейнер */
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(18, 22, 30, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 48px;
            box-shadow:
                    0 30px 60px -15px rgba(0, 0, 0, 0.8),
                    0 0 0 1px rgba(255, 255, 255, 0.03),
                    inset 0 0 60px rgba(168, 85, 247, 0.1);
            padding: 45px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(168, 85, 247, 0.2);
            animation: containerAppear 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        @keyframes containerAppear {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Декоративные элементы */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, transparent 70%);
            top: -150px;
            right: -150px;
            z-index: 0;
            animation: glowPulse 8s ease-in-out infinite;
        }

        .glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(217, 70, 239, 0.15) 0%, transparent 70%);
            bottom: -200px;
            left: -200px;
            z-index: 0;
            animation: glowPulse 12s ease-in-out infinite reverse;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 0.8; }
        }

        /* Шапка */
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
        }

        .header-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 15px 30px -10px #a855f7;
        }

        .header-icon i {
            font-size: 35px;
            color: white;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        }

        .header-icon::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            border-radius: 28px;
            z-index: -1;
            opacity: 0.5;
            filter: blur(15px);
        }

        .header-text h1 {
            font-family: "Clash Display", sans-serif;
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }

        .header-text p {
            color: #8b8f9c;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-text p i {
            color: #d946ef;
            font-size: 14px;
        }

        /* Карточка формы */
        .form-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 35px;
            border: 1px solid rgba(168, 85, 247, 0.15);
            margin-bottom: 35px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.03), rgba(217, 70, 239, 0.03), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .form-card:hover::before {
            transform: translateX(100%);
        }

        /* Аватар для формы */
        .form-avatar {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .avatar-large {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #2a2f3f, #1e2333);
            border-radius: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: "Clash Display", sans-serif;
            font-weight: 700;
            font-size: 45px;
            border: 3px solid transparent;
            background-clip: padding-box;
            position: relative;
            box-shadow: 0 20px 40px -15px #000;
        }

        .avatar-large-glow {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            border-radius: 38px;
            z-index: -1;
            opacity: 0.5;
            filter: blur(10px);
            animation: glowPulse 3s ease-in-out infinite;
        }

        /* Поля формы */
        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: #8b8f9c;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-label i {
            color: #d946ef;
            font-size: 16px;
            width: 20px;
        }

        .form-input {
            width: 100%;
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 30px;
            font-family: "General Sans", sans-serif;
            font-size: 16px;
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .form-input:focus {
            outline: none;
            border-color: #a855f7;
            background: rgba(35, 40, 55, 0.6);
            box-shadow:
                    0 0 0 3px rgba(168, 85, 247, 0.2),
                    0 10px 25px -15px #a855f7;
        }

        .form-input::placeholder {
            color: rgba(139, 143, 156, 0.5);
            font-style: italic;
        }

        /* Текущие значения */
        .current-value {
            font-size: 12px;
            color: #8b8f9c;
            margin-top: 8px;
            padding-left: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .current-value i {
            color: #a855f7;
            font-size: 10px;
        }

        .current-value span {
            color: #d946ef;
            font-weight: 600;
        }

        /* Кнопка UPDATE */
        .submit-btn {
            width: 100%;
            padding: 20px 30px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: "Clash Display", sans-serif;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -15px #a855f7;
            margin-top: 15px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 30px 50px -15px #a855f7;
            gap: 25px;
        }

        .submit-btn i {
            font-size: 24px;
            transition: all 0.4s ease;
        }

        .submit-btn:hover i:first-child {
            transform: rotate(360deg);
        }

        .submit-btn:hover i:last-child {
            transform: rotate(180deg) scale(1.2);
        }

        /* Кнопка Back */
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            color: #8b8f9c;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(10px);
            width: 100%;
        }

        .back-btn:hover {
            background: rgba(168, 85, 247, 0.1);
            border-color: #a855f7;
            color: #fff;
            gap: 18px;
            transform: translateX(-5px);
        }

        .back-btn i {
            transition: transform 0.3s ease;
        }

        .back-btn:hover i {
            transform: translateX(-5px);
        }

        /* Анимация для иконки карандаша */
        .pencil-pulse {
            animation: pencilPulse 2s infinite;
        }

        @keyframes pencilPulse {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(10deg) scale(1.1); }
            75% { transform: rotate(-10deg) scale(1.1); }
        }

        hr {
            display: none;
        }

        /* Стили для ошибок валидации */
        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 8px;
            padding-left: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>
<!-- Частицы -->
<div class="particles" id="particles"></div>

<!-- Свечения -->
<div class="glow"></div>
<div class="glow-2"></div>

<div class="container">
    <div class="header">
        <div class="header-icon">
            <i class="fas fa-user-edit"></i>
        </div>
        <div class="header-text">
            <h1>Update Person</h1>
            <p><i class="fas fa-star"></i> редактирование профиля</p>
        </div>
    </div>

    <div class="form-card">
        <div class="form-avatar">
            <div class="avatar-large">
                <i class="fas fa-pen-fancy pencil-pulse" style="font-size: 40px; color: #a855f7;"></i>
                <div class="avatar-large-glow"></div>
            </div>
        </div>

        <form th:method="PATCH" th:action="@{/{id}/update(id = ${mdUpdatePerson.getId()})}" th:object="${mdUpdatePerson}">
            <div class="form-group">
                <label for="age" class="form-label">
                    <i class="fas fa-cake-candles"></i>
                    <span>Age</span>
                </label>
                <input type="text"
                       th:field="*{age}"
                       id="age"
                       class="form-input"
                       placeholder="Enter new age...">
                <div class="current-value" th:if="${mdUpdatePerson.getAge() != null}">
                    <i class="fas fa-info-circle"></i>
                    <span>Current:</span>
                    <span th:text="${mdUpdatePerson.getAge()}">25</span> лет
                </div>
            </div>

            <div class="form-group">
                <label for="name" class="form-label">
                    <i class="fas fa-user-tag"></i>
                    <span>Name</span>
                </label>
                <input type="text"
                       th:field="*{name}"
                       id="name"
                       class="form-input"
                       placeholder="Enter new name...">
                <div class="current-value" th:if="${mdUpdatePerson.getName() != null}">
                    <i class="fas fa-info-circle"></i>
                    <span>Current:</span>
                    <span th:text="${mdUpdatePerson.getName()}">Иван Иванов</span>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">
                    <i class="fas fa-envelope"></i>
                    <span>Email</span>
                </label>
                <input type="text"
                       th:field="*{email}"
                       id="email"
                       class="form-input"
                       placeholder="Enter new email...">
                <div class="current-value" th:if="${mdUpdatePerson.getEmail() != null}">
                    <i class="fas fa-info-circle"></i>
                    <span>Current:</span>
                    <span th:text="${mdUpdatePerson.getEmail()}">ivan@example.com</span>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-pen-fancy"></i>
                <span>UPDATE</span>
                <i class="fas fa-sparkles"></i>
            </button>
        </form>
    </div>

    <a th:href="@{/{id}(id = ${mdUpdatePerson.getId()})}" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Back to profile</span>
    </a>
</div>

<script>
    // Создание частиц
    function createParticles() {
        const particlesContainer = document.getElementById('particles');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';

            const size = Math.random() * 6 + 2;
            const left = Math.random() * 100;
            const delay = Math.random() * 10;
            const duration = Math.random() * 20 + 10;
            const colors = ['#a855f7', '#d946ef', '#c084fc', '#e879f9'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            particle.style.cssText = `
                    left: ${left}%;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    animation: float ${duration}s linear ${delay}s infinite;
                    opacity: ${Math.random() * 0.3 + 0.1};
                `;

            particlesContainer.appendChild(particle);
        }
    }

    createParticles();
</script>
</body>
</html>
