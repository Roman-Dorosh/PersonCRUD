<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person | Ночная симфония</title>
    <!-- Подключаем шрифт Clash Display и General Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=General+Sans:wght@300;400;500;600&display=swap"
          rel="stylesheet">
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "General Sans", sans-serif;
            background: #0c0f15;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Анимированный фон с частицами */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            from {
                transform: translateY(100vh) rotate(0deg);
            }
            to {
                transform: translateY(-100px) rotate(360deg);
            }
        }

        /* Основной контейнер */
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(18, 22, 30, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 48px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8),
            0 0 0 1px rgba(255, 255, 255, 0.03),
            inset 0 0 60px rgba(168, 85, 247, 0.1);
            padding: 45px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(168, 85, 247, 0.2);
            animation: containerAppear 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        @keyframes containerAppear {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Декоративные элементы */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, transparent 70%);
            top: -150px;
            right: -150px;
            z-index: 0;
            animation: glowPulse 8s ease-in-out infinite;
        }

        .glow-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(217, 70, 239, 0.15) 0%, transparent 70%);
            bottom: -200px;
            left: -200px;
            z-index: 0;
            animation: glowPulse 12s ease-in-out infinite reverse;
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.8;
            }
        }

        /* Шапка */
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            position: relative;
            z-index: 2;
        }

        .header-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 15px 30px -10px #a855f7;
        }

        .header-icon i {
            font-size: 35px;
            color: white;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        }

        .header-icon::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            border-radius: 28px;
            z-index: -1;
            opacity: 0.5;
            filter: blur(15px);
        }

        .header-text h1 {
            font-family: "Clash Display", sans-serif;
            font-size: 38px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }

        .header-text p {
            color: #8b8f9c;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-text p i {
            color: #d946ef;
            font-size: 14px;
        }

        /* Карточка с данными */
        .profile-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 35px;
            border: 1px solid rgba(168, 85, 247, 0.15);
            margin-bottom: 35px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.03), rgba(217, 70, 239, 0.03), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .profile-card:hover::before {
            transform: translateX(100%);
        }

        /* Аватар */
        .profile-avatar {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .avatar-large {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #2a2f3f, #1e2333);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: "Clash Display", sans-serif;
            font-weight: 700;
            font-size: 52px;
            border: 3px solid transparent;
            background-clip: padding-box;
            position: relative;
            box-shadow: 0 20px 40px -15px #000;
        }

        .avatar-large-glow {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            border-radius: 43px;
            z-index: -1;
            opacity: 0.7;
            filter: blur(10px);
            animation: glowPulse 3s ease-in-out infinite;
        }

        /* Информация */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            border: 1px solid rgba(168, 85, 247, 0.1);
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: rgba(35, 40, 55, 0.6);
            border-color: rgba(168, 85, 247, 0.3);
            transform: translateX(5px);
            box-shadow: 0 10px 25px -15px #a855f7;
        }

        .info-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px -10px #a855f7;
        }

        .info-icon i {
            font-size: 24px;
            color: white;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 14px;
            color: #8b8f9c;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            font-family: "Clash Display", sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            word-break: break-word;
        }

        /* Группа кнопок */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        /* Кнопка Update */
        .update-btn {
            flex: 1;
            padding: 18px 25px;
            background: linear-gradient(135deg, #a855f7, #d946ef);
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 30px -12px #a855f7;
        }

        .update-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .update-btn:hover::before {
            left: 100%;
        }

        .update-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 25px 40px -12px #a855f7;
            gap: 18px;
        }

        .update-btn i {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .update-btn:hover i {
            transform: rotate(360deg);
        }

        /* Форма удаления */
        .delete-form {
            width: 100%;
        }

        .delete-btn {
            width: 100%;
            padding: 18px 25px;
            background: rgba(255, 255, 255, 0.02);
            color: #ff6b6b;
            text-decoration: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 107, 107, 0.3);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }

        .delete-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 107, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .delete-btn:hover::before {
            left: 100%;
        }

        .delete-btn:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: #ff6b6b;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px -15px #ff6b6b;
            color: #ff8a8a;
            gap: 18px;
        }

        .delete-btn i {
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .delete-btn:hover i {
            transform: scale(1.2) rotate(180deg);
        }

        /* Кнопка Back */
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            color: #8b8f9c;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(10px);
            width: 100%;
        }

        .back-btn:hover {
            background: rgba(168, 85, 247, 0.1);
            border-color: #a855f7;
            color: #fff;
            gap: 18px;
            transform: translateX(-5px);
        }

        .back-btn i {
            transition: transform 0.3s ease;
        }

        .back-btn:hover i {
            transform: translateX(-5px);
        }

        hr {
            display: none;
        }
    </style>
</head>
<body>
<!-- Частицы -->
<div class="particles" id="particles"></div>

<!-- Свечения -->
<div class="glow"></div>
<div class="glow-2"></div>

<div class="container">
    <div class="header">
        <div class="header-icon">
            <i class="fas fa-user"></i>
        </div>
        <div class="header-text">
            <h1>Person Data</h1>
            <p><i class="fas fa-star"></i> профиль участника</p>
        </div>
    </div>

    <div class="profile-card" th:if="${mdGetPerson != null}">
        <div class="profile-avatar">
            <div class="avatar-large">
                <span th:text="${#strings.substring(mdGetPerson.getName(), 0, 1)}">A</span>
                <div class="avatar-large-glow"></div>
            </div>
        </div>

        <div class="info-list">
            <div class="info-item">
                <div class="info-icon">
                    <i class="fas fa-cake-candles"></i>
                </div>
                <div class="info-content">
                    <div class="info-label">Возраст</div>
                    <div class="info-value" th:text="${mdGetPerson.getAge()} + ' лет'">25 лет</div>
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon">
                    <i class="fas fa-user-tag"></i>
                </div>
                <div class="info-content">
                    <div class="info-label">Имя</div>
                    <div class="info-value" th:text="${mdGetPerson.getName()}">Иван Иванов</div>
                </div>
            </div>

            <div class="info-item">
                <div class="info-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="info-content">
                    <div class="info-label">Email</div>
                    <div class="info-value" th:text="${mdGetPerson.getEmail()}">ivan@example.com</div>
                </div>
            </div>
        </div>
    </div>

    <div class="action-buttons">
        <a th:href="@{/{id}/update(id = ${mdGetPerson.getId()})}" class="update-btn">
            <i class="fas fa-pen-fancy"></i>
            <span>Update</span>
        </a>
    </div>

    <form th:method="DELETE" th:action="@{/{id}/delete(id = ${mdGetPerson.getId()})}" th:object="${mdGetPerson}"
          class="delete-form">
        <button type="submit" class="delete-btn">
            <i class="fas fa-trash-alt"></i>
            <span>DELETE</span>
            <i class="fas fa-skull" style="font-size: 16px;"></i>
        </button>
    </form>

    <a href="http://localhost:8080/" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Back to list</span>
    </a>
</div>

<script>
    // Создание частиц
    function createParticles() {
        const particlesContainer = document.getElementById('particles');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';

            const size = Math.random() * 6 + 2;
            const left = Math.random() * 100;
            const delay = Math.random() * 10;
            const duration = Math.random() * 20 + 10;
            const colors = ['#a855f7', '#d946ef', '#c084fc', '#e879f9'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            particle.style.cssText = `
                    left: ${left}%;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    animation: float ${duration}s linear ${delay}s infinite;
                    opacity: ${Math.random() * 0.3 + 0.1};
                `;

            particlesContainer.appendChild(particle);
        }
    }

    createParticles();
</script>
</body>
</html>
